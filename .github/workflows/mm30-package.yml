name: Guarded combined PR30 package integration
on:
  push:
    branches: [diagnostics/mm30-readonly-20261012-astra]
    paths: [.github/workflows/mm30-package.yml]
permissions:
  contents: write
concurrency:
  group: mm30-owned-package-integration
  cancel-in-progress: false
jobs:
  integrate-verify-owned-branch:
    if: github.repository == 'Jevelopers-neatHack-2026/marketing-material' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE: 38c6d60d8863fd17136b3f9e6d6d94b3b6efc8ff
      MAIN: 79ae21607eb4d98188f85ce3c42b8be6eb5688bc
      ANNOUNCEMENT: 80ed73f3b86c32b1cc0139174cad6f390afd39c4
      TARGET: fix/mm22-recording-review-20261012-astra
    steps:
      - name: Prepare isolated source and exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Jevelopers-neatHack-2026/marketing-material.git source
          git -C source checkout -b mm30-local-integration "$SOURCE"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE"
          test "$(git -C source rev-parse origin/main)" = "$MAIN"
          test "$(git -C source rev-parse origin/fix/mm04-announcement-submission-20261012-astra)" = "$ANNOUNCEMENT"
          test -z "$(git -C source status --porcelain)"
          /usr/bin/python3 -c 'import sys, platform; print(sys.version); print(platform.platform()); assert sys.version_info[:3] == (3, 9, 6), sys.version'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/mm30-integration-venv"
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -m pip install --no-cache-dir --only-binary=:all: Pillow==11.3.0
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -c 'import PIL; print(PIL.__version__); assert PIL.__version__ == "11.3.0"'
          git -C source show "$GITHUB_SHA:.github/diagnostics/mm30_package_adapter.py" > "$RUNNER_TEMP/mm30-package-adapter.py"
          test "$(shasum -a 256 "$RUNNER_TEMP/mm30-package-adapter.py" | cut -d ' ' -f 1)" = ec8724e66c88e2d6e5ca503ba0a2181f22a6a466c14682b5deaaa1c413f84199
      - name: Build only the pinned FFprobe inspection tool
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch n8.1 https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffmpeg-source"
          cd "$RUNNER_TEMP/ffmpeg-source"
          test "$(git rev-parse HEAD)" = 9047fa1b084f76b1b4d065af2d743df1b40dfb56
          test "$(git rev-parse refs/tags/n8.1)" = a65b3bfe9dacc3b20597ef199d0afdd8bc8128e2
          ./configure --disable-doc --disable-debug --disable-network --disable-autodetect --disable-everything --disable-programs --enable-ffprobe --enable-protocol=file --enable-demuxer=mov --enable-parser=h264 --enable-decoder=h264 --disable-x86asm > "$RUNNER_TEMP/ffprobe-configure.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ffprobe-configure.log"; exit 1; }
          make -j3 ffprobe > "$RUNNER_TEMP/ffprobe-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/ffprobe-build.log"; exit 1; }
          ./ffprobe -version
          shasum -a 256 ffprobe
          echo "$RUNNER_TEMP/ffmpeg-source" >> "$GITHUB_PATH"
      - name: Merge exact source commits without discarding any writer history
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$MAIN"
          git merge --no-ff --no-edit "$ANNOUNCEMENT"
          git merge-base --is-ancestor "$SOURCE" HEAD
          git merge-base --is-ancestor "$MAIN" HEAD
          git merge-base --is-ancestor "$ANNOUNCEMENT" HEAD
          test -z "$(git status --porcelain)"
          git log -3 --format='%H %P %s'
          echo "MM_COMBINED_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reconcile bindings and run the complete retained integration gates
        shell: bash
        run: |
          set -euo pipefail
          cd source
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -B "$RUNNER_TEMP/mm30-package-adapter.py"
      - name: Fast-forward only the unchanged owned PR30 branch after all gates pass
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd source
          DELIVERY=$(cat "$RUNNER_TEMP/mm-results/delivery-commit.txt")
          test "$(git rev-parse HEAD)" = "$DELIVERY"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$SOURCE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/fix/mm04-announcement-submission-20261012-astra | cut -f1)" = "$ANNOUNCEMENT"
          git merge-base --is-ancestor "$SOURCE" "$DELIVERY"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          printf '::add-mask::%s\n' "$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$DELIVERY:refs/heads/$TARGET"
          unset AUTH GH_TOKEN
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$DELIVERY"
          printf 'PUSHED_FOR_INDEPENDENT_REVIEW_NOT_MERGE %s\n' "$DELIVERY"
      - name: Fresh receiver verifies the exact pushed candidate
        shell: bash
        run: |
          set -euo pipefail
          DELIVERY=$(cat "$RUNNER_TEMP/mm-results/delivery-commit.txt")
          git clone --no-checkout https://github.com/Jevelopers-neatHack-2026/marketing-material.git receiver
          git -C receiver checkout --detach "$DELIVERY"
          cd receiver
          test "$(git rev-parse HEAD)" = "$DELIVERY"
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -B -m unittest discover -s tests -v
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -B tools/validate_collateral.py --mode draft
          "$RUNNER_TEMP/mm30-integration-venv/bin/python" -B tools/package_collateral.py validate release/v0.1.0-rehearsal/manifest.json
          git diff --check
          test -z "$(git status --porcelain)"
          printf 'FRESH_RECEIVER_VERIFIED %s; independent review and merge authorization are separate.\n' "$DELIVERY"
